<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Movement Tracker</title>

  <!-- iOS Full-Screen Standalone App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SMT Tracker">

  <!-- Android Full-Screen Standalone App Settings -->
  <link rel="manifest" href="manifest.json">

  <!-- Icon Configuration -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Dynamic full-screen container -->
  <iframe id="app-frame" allow="geolocation; camera"></iframe>

  <script>
    // Base Google Apps Script URL
    const baseUrl = "https://script.google.com/macros/s/AKfycbxpXslm2Kg1AA1-io4UgF0ewA7kJBMGT12S5OXRNdORn59lqSjhwwuCLUGw0YS8PCh5sw/exec";

    // Extract any query parameters attached to the GitHub link (e.g., "?page=form")
    const currentParams = window.location.search;

    // Forward parameters into the iframe source URL
    document.getElementById("app-frame").src = baseUrl + currentParams;
  </script>
</body>
</html>
